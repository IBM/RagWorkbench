# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  # DCO (Developer Certificate of Origin) check
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  # Check for DCO sign-off in commit messages
  - repo: local
    hooks:
      - id: check-dco-signoff
        name: Check DCO Sign-off
        entry: bash -c 'if ! git log -1 --pretty=%B | grep -q "^Signed-off-by"; then echo "Error - Commit must include DCO sign-off. Use git commit -s"; exit 1; fi'
        language: system
        stages: [commit-msg]
        always_run: true

  # Black first
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        args: [--config=pyproject.toml]
        language_version: python3.11

  # Ruff second (linting)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # MyPy - Static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0
          - typing-extensions
          - docling-core
          - pandas-stubs
          - pandas
          - types-requests
          - pandas-stubs
          - pandas
          - types-PyYAML
        args: [--config-file=pyproject.toml, --explicit-package-bases]
        files: ^src/
