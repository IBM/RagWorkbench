[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-rag"
version = "0.1.0"
description = "Simple RAG pipeline implementation for RagWorkbench"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "ragworkbench>=0.1.0",
    "pymilvus>=2.3.0",
    "litellm>=1.0.0",
    "docling>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
