name: ragbench (CI on pull requests)

on:
  pull_request:
    branches: [ main ]
    # Run when a PR is created or updated (new commits pushed)
    types: [opened, synchronize, reopened, ready_for_review]
    # Optional: ignore docs-only changes
    paths-ignore:
       - 'docs/**'
       - '**/*.md'

permissions:
  contents: read

# Cancel previous in-progress runs for the same PR to save runner capacity
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (Python)
    runs-on: ibm-x86-64-large

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RITS_API_KEY: ${{ secrets.RITS_API_KEY }}
      WATSONX_APIKEY: ${{ secrets.WATSONX_APIKEY }}
      WATSONX_PROJECT_ID: ${{ secrets.WATSONX_PROJECT_ID }}
      WATSONX_URL: ${{ secrets.WATSONX_URL }}
      LAKEHOUSE_TOKEN: ${{ secrets.LAKEHOUSE_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      API_URL: ${{ github.api_url }}          # e.g., https://api.github.com
      REPO: ${{ github.repository }}          # owner/repo
      NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
#      OLLAMA_HOST: "172.17.0.1:11434"
      SPAN_DEBUG: "off"
      TEST_PROVIDER_ID: watsonx

    # Skip CI for draft PRs
    if: ${{ github.event.pull_request.draft == false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Choose Python version to be 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # Built-in pip cache to speed up repeated runs
          cache: 'pip'
          # Cache key derived from these files if they exist (supports globs)
          cache-dependency-path: |
            pyproject.toml

      - name: Set up SSH for GHE private deps (heredoc) # This step replaces the webfactory/ssh-agent@v0.9.0 action which is not supported
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/id_ed25519 <<'EOF'
          ${{ secrets.GH_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_ed25519

          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

          ssh-keyscan -t ecdsa github.ibm.com >> ~/.ssh/known_hosts || true
          ssh-keyscan -t rsa github.ibm.com   >> ~/.ssh/known_hosts || true
          ssh-keyscan -t ed25519 github.ibm.com >> ~/.ssh/known_hosts || true
          chmod 644 ~/.ssh/known_hosts


      # Trust GitHub's SSH host key (prevent "Host key verification failed")
      - name: Add github.com to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Use rsa + ed25519 to cover modern keys
          ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # (Optional) Pin SSH options used by uv/pip's git commands
      # Explanation:
      # GIT_SSH_COMMAND=... is a special environment variable that Git honors.
      #      Whenever Git needs to use SSH (e.g., git fetch ssh://git@github.ibm.com/...), it will invoke SSH using the exact command string you provide. This lets you enforce options like host key checking, custom known_hosts path, identity files, etc.
      #
      # -o StrictHostKeyChecking=yes tells SSH to refuse connections to hosts whose key is not already in ~/.ssh/known_hosts.
      #
      # This prevents silent trust of unknown hosts (which could be a MITM risk).
      # With this option, you must pre-populate known_hosts (we did using ssh-keyscan for github.ibm.com).
      # $GITHUB_ENV appends the environment variable to GitHub Actions’ special file so it becomes available to all subsequent steps in the job.
      # In Actions, writing VAR=value to $GITHUB_ENV is the supported way to export environment variables across steps.
      - name: Export GIT_SSH_COMMAND
        run: |
          echo "GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=yes" >> $GITHUB_ENV


      # Show environment info (helpful on self-hosted runners)
      - name: Environment info
        run: |
          python --version
          which python
          pip --version
          uname -a

      # Install uv (fast Python package installer)
      - name: Install uv
        run: |
          pip install --upgrade pip
          pip install uv


      # Create and activate a virtual environment managed by uv
      - name: Create venv
        run: |
          uv venv .venv
          source .venv/bin/activate

      - name: Install dependencies (pyproject.toml)
        run: |
          source .venv/bin/activate
          UV_LINK_MODE=copy uv pip install .

      - name: Run pre-commit
        run: |
          source .venv/bin/activate
          pre-commit run --all-files

      # Run tests
      - name: Run tests/
        run: |
          source .venv/bin/activate
          python -m pytest --durations=20 --timeout=600 -x -m "not exclude"  tests/
