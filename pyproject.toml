[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragbench"
version = "0.1.0"
description = "A comprehensive benchmarking framework for Retrieval-Augmented Generation (RAG) systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Matan Orbach", email = "matano@il.ibm.com"},
    {name = "Assaf Toledo", email = "assaf.toledo@ibm.com"},
    {name = "Benjamin Sznajder", email = "benjams@il.ibm.com"},
]
maintainers = [
    {name = "Matan Orbach", email = "matano@il.ibm.com"},
    {name = "Assaf Toledo", email = "assaf.toledo@ibm.com"},
    {name = "Benjamin Sznajder", email = "benjams@il.ibm.com"},
]
keywords = ["rag", "retrieval", "generatiohn", "benchmark", "nlp", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

#[mypy.missing_imports]
#mlflow = true

dependencies = [
    "pydantic>=2.0",
    "docling-core",
    "typing-extensions",
    "datasets>=4.5.0",
    "mlflow>=3.1",
    "pandas-stubs~=2.3.3",
    "pandas"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "isort==7.0.0",
    "ruff==0.14.14",
    "black==26.1.0",
    "pre-commit==4.5.1",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]
examples = [
    "docling"
]
all = [
    "ragbench[dev,docs,examples]",
]

[project.urls]
Homepage = "https://github.com/yourusername/ragbench"
Documentation = "https://github.com/yourusername/ragbench#readme"
Repository = "https://github.com/yourusername/ragbench"
Issues = "https://github.com/yourusername/ragbench/issues"
Changelog = "https://github.com/yourusername/ragbench/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench"]

[tool.ruff]
line-length = 88
target-version = "py313"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# Per-module overrides for untyped libraries
[[tool.mypy.overrides]]
module = ["mlflow.*"]
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'
