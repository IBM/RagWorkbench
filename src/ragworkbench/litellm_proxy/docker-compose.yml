services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5439:5432"  # Local port 5439 maps to container port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4001:4000"  # Host port 4001 maps to container port 4000
    volumes:
      - ./config.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - UI_USERNAME=${UI_USERNAME}
      - UI_PASSWORD=${UI_PASSWORD}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - LITELLM_MODE=production
      - LITELLM_PROXY_BASE_URL=http://localhost:4001
      - LITELLM_LOG_TRUNCATE_LIMIT=0
      - LITELLM_LOG_STR_TRUNCATE_LIMIT=0
      - LITELLM_LOG_COLUMN_SIZE=100000
      - MAX_STRING_LENGTH_PROMPT_IN_DB=1000000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
